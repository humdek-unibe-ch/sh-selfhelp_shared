#
# Automated npm publish for @selfhelp/shared via npm Trusted Publishing
# (GitHub OIDC). Fires ONLY on version tag pushes (`v*`). No npm token is
# stored in the repo or in GitHub secrets: npm exchanges this workflow's
# OIDC id-token for a short-lived publish credential, which also produces
# provenance attestations automatically.
#
# One-time setup on npmjs.com (Package -> Settings -> Trusted Publisher ->
# GitHub Actions), done once by a package owner before the first run:
#   - Organization:   humdek-unibe-ch
#   - Repository:     sh-selfhelp_shared
#   - Workflow file:  publish.yml
#   - Environment:    (leave blank)
#
# Full release flow: docs/developer/release-and-versioning.md

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read      # checkout
  id-token: write     # required for npm Trusted Publishing (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      # Node 22 ships npm 10.x; npm Trusted Publishing (OIDC) requires
      # npm >= 11.5.1. Upgrade so `npm publish` performs the OIDC token
      # exchange instead of expecting a stored auth token.
      #
      # npm 12.0.0's published tarball omits the bundled `sigstore` module
      # that libnpmpublish still requires for provenance (Trusted Publishing
      # enables provenance by default) — upstream npm/cli#9722. Until a
      # patched 12.x ships, drop sigstore into npm's own node_modules so
      # libnpmpublish's require() resolves it.
      - name: Upgrade npm (OIDC-capable)
        run: |
          npm install -g npm@latest
          NPM_HOME="$(npm root -g)/npm"
          npm install --no-save --prefix "$NPM_HOME" sigstore@^5
          node -e "require(process.argv[1]); console.log('sigstore ok')" "$NPM_HOME/node_modules/sigstore"

      - name: Install dependencies
        run: npm ci

      # A published artifact must pass the same quality gate as a PR before it is
      # built and pushed to npm — never publish something that would fail CI.
      - name: License headers
        run: npm run headers:check

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: with `id-token: write` and a configured Trusted
      # Publisher on npmjs.com, npm authenticates via OIDC and attaches
      # provenance automatically.
      - name: Publish to npm
        run: npm publish
